<!doctype html>
<html lang="en" data-theme="dark" data-baseurl="{{ site.baseurl }}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!--
    Applied before first paint so a reload does not flash the wrong theme.
    Kept inline and tiny on purpose; the rest of the JS is deferred.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hipep-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute(
          'data-theme', saved || (prefersLight ? 'light' : 'dark'));
      } catch (e) { /* private mode: fall back to the dark default */ }
    })();
  </script>
</head>

<body class="site-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    {% include header.html %}
    <main class="page__inner" id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="{{ '/assets/script.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>

</html>
