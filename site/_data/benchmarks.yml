# The latest benchmark snapshot, rendered by site/docs/benchmarks/index.md and
# quoted on the model cards at site/models.md.
#
# Every `id` here must exist in site/_data/models.yml, which is where the
# display name and the model's identity live. This file carries numbers only.
#
# Policy for this page (decided for v1): one snapshot only. No version history,
# no trend lines, no comparison against other runtimes. A stale snapshot is
# worse than no snapshot, so `snapshot.run_date` is rendered prominently and
# must be updated with the numbers, never separately.
#
# Updating this file is the whole job of publishing a new snapshot: replace the
# numbers, set `run_date`, set `release`. No page needs to change.

snapshot:
  placeholder: true
  release: v0.4.0
  run_date: "2026-09-07"
  gpu: Ryzen AI Max ("Strix Halo", gfx1151)
  # The dashboard export does not record the OS or the driver version. Windows
  # is what the run used, but confirm it against the harness config before
  # publishing a new snapshot rather than carrying this line forward blindly --
  # the whole point of the page is that the conditions are checkable.
  os: Windows
  note: >-
    Single machine, runs executed serially. Numbers from a different GPU,
    driver or thermal envelope are not comparable to these.

# Prompt lengths, in tokens, used as the column groups of the LM table.
prompt_lengths: [128, 2048, 16384]

# TTFT is seconds to the first generated token, lower is better.
# TPS is generated tokens per second in steady state, higher is better.
# Both are ordered to match `prompt_lengths`.
lm:
