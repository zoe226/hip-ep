# The official model matrix, rendered by site/docs/models/index.md and by
# site/models.md, and used by site/docs/benchmarks/index.md to resolve the
# display name for every benchmark row.
#
# Scope, decided for v1: generative language models only -- eight text and
# eight vision-language, sixteen in total. The release validation suite also
# covers Whisper and single-graph vision models; those are deliberately not
# published on this site, so do not re-add a tier here without also adding the
# page sections and the benchmark rows to match.
#
# `id` is the join key. Every id used in site/_data/benchmarks.yml must exist
# here, or that row renders with a bare slug and no model behind it.
#
# `name` is the base model, not the artifact. The quantized ONNX exports the
# validation suite actually runs live in AMD-owned Hugging Face repositories
# that are not all public, so naming the base model plus the quantization is
# both accurate and linkable. `hf` is the base model's repository.
#
# `highlight: true` promotes a model onto the card wall at /models/ and onto the
# landing page. Keep that set small -- it is a showcase, not a second copy of
# the matrix -- and keep it a multiple of three, because both walls lay out
# three to a row and a seventh card sits alone on a row of its own.

llm:
  - id: gpt-oss-20b
    name: GPT-OSS 20B
    hf: openai/gpt-oss-20b
    params: 20B total, 3.6B active
    arch: Sparse mixture of experts
    task: Text generation, reasoning
    precision: int4 RTN, block 32
    status: Validated
    highlight: true
    tagline: >-
      The fastest model in the matrix, and a sparse MoE — the architecture that
      breaks naive per-operator dispatch.

  - id: gpt-oss-120b
    name: GPT-OSS 120B
    hf: openai/gpt-oss-120b
    params: 120B total, 5.1B active
    arch: Sparse mixture of experts
    task: Text generation, reasoning
    precision: uint4 AWQ, per-group asymmetric
    status: Validated
    highlight: true
    tagline: >-
      120B parameters on an integrated GPU, at interactive speed. This is what
      128 GB of unified memory is for.

  - id: qwen2.5-coder-14b
    name: Qwen2.5-Coder 14B Instruct
    hf: Qwen/Qwen2.5-Coder-14B-Instruct
    params: 14B
    arch: Dense transformer
    task: Code generation
    precision: int4 RTN, group 128
    status: Validated
    tagline: >-
      A coding assistant that fits in local memory and holds a 16K-token file in
      its context without falling over.

  - id: qwen2.5-14b
    name: Qwen2.5 14B Instruct
    hf: Qwen/Qwen2.5-14B-Instruct
    params: 14B
    arch: Dense transformer
    task: Text generation
    precision: int4 RTN, group 128
    status: Validated

  - id: llama-3.1-8b
    name: Llama 3.1 8B
    hf: meta-llama/Llama-3.1-8B
    params: 8B
    arch: Dense transformer
    task: Text generation
    precision: int4 AWQ, group 128, asymmetric
    status: Validated

  - id: mistral-7b-v0.3
    name: Mistral 7B Instruct v0.3
    hf: mistralai/Mistral-7B-Instruct-v0.3
    params: 7B
    arch: Dense transformer
    task: Text generation
    precision: int4 AWQ, block 128
    status: Validated

  - id: phi-4-14b
    name: Phi-4 14B
    hf: microsoft/phi-4
    params: 14B
    arch: Dense transformer
    task: Text generation, reasoning
    precision: int4 RTN, block 32
    status: Validated

  - id: deepseek-r1-distill-llama-70b
    name: DeepSeek-R1-Distill-Llama 70B
    hf: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    params: 70B
    arch: Dense transformer
    task: Text generation, reasoning
    precision: int4 AWQ, block 128
    status: Validated
    highlight: true
    tagline: >-
      The largest dense model in the matrix. Included because a 70B dense
      decoder is where memory planning stops being an implementation detail.

vlm:
